name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The root prj.conf serves `west` builds and zephyr/prj.conf serves the
  # Seeed PlatformIO builder. They describe the same application and must not
  # drift apart.
  config-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: prj.conf copies must be identical
        run: diff -u firmware-nrf54lm20a/prj.conf firmware-nrf54lm20a/zephyr/prj.conf

  build-nrf54lm20a:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/penv
          key: pio-nrf54lm20a-${{ hashFiles('firmware-nrf54lm20a/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        run: pio run -d firmware-nrf54lm20a
