name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build both configurations the way docs/vscode-build.md describes them: a
  # real `west --sysbuild` build producing MCUboot + the signed application,
  # against the upstream Zephyr revision pinned in west.yml.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # `debug` — console on, no extra fragments. Zephyr picks up prj.conf
          # and app.overlay itself; CMakeLists.txt adds upstream_fixups.overlay.
          - config: debug
            variant: bringup
            extra: ""
          # `lowpower` — the deployment profile from docs/low-power.md. The
          # fragments go in the EXTRA_* variables, never the base ones: the base
          # variables replace prj.conf/app.overlay instead of merging onto them,
          # and the devicetree half of that mistake compiles cleanly into a
          # broken image.
          - config: lowpower
            variant: lowpower
            extra: >-
              -DEXTRA_CONF_FILE=low-power.conf
              -DEXTRA_DTC_OVERLAY_FILE=low-power.overlay
    name: build (${{ matrix.config }})
    steps:
      - uses: actions/checkout@v4
        with:
          path: hiveinside

      - name: Verify the west-only source tree
        working-directory: hiveinside
        run: |
          set -eux
          # Keep application configuration single-sourced. A second prj.conf
          # usually means that an obsolete build frontend has crept back in.
          test "$(find . -name prj.conf -type f | wc -l)" -eq 1
          test -f firmware-nrf54lm20a/prj.conf

          # These files belonged to the retired build frontend and must not be
          # reintroduced alongside the supported west + sysbuild workflow.
          test ! -e firmware-nrf54lm20a/platformio.ini
          test ! -e firmware-nrf54lm20a/zephyr
          test -z "$(find . -type d -name parts -print -quit)"
          test -z "$(find . -type f \( -name 'pio_guard*' -o -name '*.pyc' \) -print -quit)"

          # Keep the upstream clock fixup independent of optional node labels.
          # A topic branch once restored &xo/&lfclk/&xo24m references from an
          # older base; upstream boards without those labels then failed in the
          # devicetree parser before compilation.  The children are stable by
          # name beneath &clock, which is the portable form used here.
          overlay=firmware-nrf54lm20a/upstream_fixups.overlay
          ! grep -Eq '^&(xo|lfclk|xo24m)[[:space:]]*\{' "$overlay"
          grep -Eq '^&clock[[:space:]]*\{' "$overlay"
          grep -Eq '^[[:space:]]*xo[[:space:]]*\{' "$overlay"
          grep -Eq '^[[:space:]]*lfclk[[:space:]]*\{' "$overlay"
          grep -Eq '^[[:space:]]*xo24m[[:space:]]*\{' "$overlay"

      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: hiveinside
          toolchains: arm-zephyr-eabi

      - name: Build ${{ matrix.config }}
        working-directory: hiveinside
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          set -eux
          west build --pristine=always --sysbuild \
            -b xiao_nrf54lm20a/nrf54lm20a/cpuapp \
            -d "${{ matrix.config }}" \
            firmware-nrf54lm20a \
            ${EXTRA:+-- $EXTRA}

      - name: Verify the bootable image and the stamped OTA payload
        working-directory: hiveinside
        run: |
          set -eux
          # Upstream Zephyr sysbuild records the separately flashable domains
          # in domains.yaml rather than producing NCS's merged.hex artifact.
          # Check both pieces that `west flash` consumes: the bootloader and
          # the signed slot-0 application.
          test -f "${{ matrix.config }}/domains.yaml"
          test -f "${{ matrix.config }}/mcuboot/zephyr/zephyr.hex"
          test -f "${{ matrix.config }}/firmware-nrf54lm20a/zephyr/zephyr.signed.hex"
          # The version-stamped payload is what gets uploaded over BLE. Its
          # suffix is derived from CONFIG_SERIAL in the image actually built,
          # so checking it here catches a fragment that was silently not
          # applied — the failure docs/vscode-build.md warns about.
          out="${{ matrix.config }}/firmware-nrf54lm20a/zephyr"
          ls -l "$out"/hiveinside-nrf54lm20a-v*-${{ matrix.variant }}.signed.bin

      # Keep the images around so a change can be tried on hardware before it
      # is tagged. Releases are built and published by release.yml; these are
      # the same files without the manifest, checksums and flashing bundle.
      - name: Keep the images for testers
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ matrix.variant }}
          path: |
            hiveinside/${{ matrix.config }}/firmware-nrf54lm20a/zephyr/hiveinside-*.signed.bin
            hiveinside/${{ matrix.config }}/firmware-nrf54lm20a/zephyr/zephyr.signed.hex
            hiveinside/${{ matrix.config }}/mcuboot/zephyr/zephyr.hex
          if-no-files-found: error
          retention-days: 14
