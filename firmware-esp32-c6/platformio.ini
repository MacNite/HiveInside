; HiveInside — deprecated XIAO ESP32-C6 BLE in-hive sensor prototype
;
; A quick bring-up of the HiveInside sensor suite on cheap modules before the
; XIAO nRF54LM20A Sense final board:
;     Seeed XIAO ESP32-C6  +  LIS3DH  +  SHT40  +  MP34DT01/PDM mic
;
; Retained for historical testing and migration reference. New firmware work
; targets firmware-nrf54lm20a/ instead; do not remove this prototype's OTA path.
; Build/upload from VSCodium (PlatformIO extension) or the CLI:
;     pio run -e c6_gatt_deprecated -t upload

[platformio]
default_envs = c6_gatt_deprecated
src_dir = src
include_dir = include

[env]
; ESP32-C6 needs Arduino-ESP32 3.x (ESP-IDF 5.x) for both its radio and the
; channel-based I2S PDM driver the mic uses. Pinned to a known-good
; pioarduino release (same family HiveScale pins), which ships the C6 core.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
; Generic ESP32-C6 board profile — works for the XIAO ESP32-C6 (4 MB flash);
; all pins are set explicitly in include/config.h.
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
; Dual-OTA partition layout so HiveScale can push firmware over BLE (see
; partitions_4mb_ota_no_fs.csv and docs/ota-over-ble.md). Without this the C6
; has a single app slot and Update.begin() has nowhere to write the new image.
board_build.partitions = partitions_4mb_ota_no_fs.csv

; After each build, write a version-stamped copy of firmware.bin named
; hiveinside_<x.y.z>.bin (version read from HIVEINSIDE_FW_VERSION in
; include/config.h). See rename_fw.py.
extra_scripts = post:rename_fw.py

build_flags =
    -std=gnu++17
    -Os
    -DCORE_DEBUG_LEVEL=1
    ; Firmware-over-BLE (OTA) target support. Set to 0 to compile it out.
    -DHIVEINSIDE_OTA_ENABLED=1
    ; The XIAO ESP32-C6's USB-C port is the chip's native USB Serial/JTAG.
    ; Without these, Arduino's Serial.* goes to UART0 (physical TX/RX pins) and
    ; nothing the firmware prints reaches USB — only the low-level IDF console
    ; does. Route Serial to the native USB port so the [HiveInside]/[BLE]/[I2C]/
    ; [SHT40]/[MIC]/... diagnostics actually appear in the serial monitor.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Feature toggles — flip to 0 to compile a sensor out during bring-up.
    -DENABLE_SHT40=1
    -DENABLE_ACCEL=1
    -DENABLE_MIC=1
    -DENABLE_BATTERY=1

lib_deps =
    ; FFT for the vibration + decoded-PDM acoustic band analysis (same lib as HiveScale).
    kosme/arduinoFFT@^2.0.4
    ; SHT40 temperature + humidity.
    adafruit/Adafruit SHT4x Library@^1.0.5
    adafruit/Adafruit BusIO@^1.16.1
    ; BLE: NimBLE 2.x — the version that supports the ESP32-C6 radio.
    h2zero/NimBLE-Arduino@^2.2.0
    ; JSON for the GATT measurement characteristic.
    bblanchon/ArduinoJson@^7.2.0

; ---------------------------------------------------------------------------
; Connectable GATT server exposing Battery + Environmental Sensing + the custom
; HiveInside JSON characteristic (the full FFT dataset).
; ---------------------------------------------------------------------------
[env:c6_gatt_deprecated]
build_flags =
    ${env.build_flags}

; Compatibility alias for existing commands and CI jobs. It intentionally
; inherits the deprecated environment so both produce the same configuration.
[env:c6_gatt]
extends = env:c6_gatt_deprecated
