; HiveInside firmware — PlatformIO project configuration
;
; Target: Nordic nRF52840
;   * Prototype board:  Nice!Nano v2 (USB-C, UF2 bootloader) -> env:nice_nano
;   * Production board:  Ebyte E73-2G4M08S1C custom PCB        -> env:e73_custom
;
; Build/upload from VSCodium with the PlatformIO extension, or on the CLI:
;     pio run -e nice_nano -t upload

[platformio]
default_envs = nice_nano
src_dir = src
include_dir = include

; ---------------------------------------------------------------------------
; Shared settings for every environment
; ---------------------------------------------------------------------------
[env]
platform = nordicnrf52
framework = arduino
monitor_speed = 115200

; Libraries. Pin versions before first release.
lib_deps =
    ; FFT for the acoustic band analysis (same lib family as HiveScale)
    kosme/arduinoFFT@^2.0.4
    ; I2C sensor drivers
    adafruit/Adafruit LIS2DH@^1.3.0
    adafruit/Adafruit SHT4x Library@^1.0.5
    adafruit/Adafruit LPS2X@^2.0.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.16.1

build_flags =
    -DCFG_DEBUG=0
    ; Feature toggles — compile sensors in/out for bring-up
    -DENABLE_ACCEL=1
    -DENABLE_SHT4X=1
    -DENABLE_LPS22=1
    -DENABLE_MIC=1
    -DENABLE_BUTTON=1

; ---------------------------------------------------------------------------
; Prototype: Nice!Nano v2 — flashes over USB via the UF2 bootloader.
; No external programmer needed; double-tap RESET to enter the bootloader.
; ---------------------------------------------------------------------------
[env:nice_nano]
board = nice_nano
; The Adafruit nRF52 core ships a UF2 bootloader uploader.
upload_protocol = nrfutil

; ---------------------------------------------------------------------------
; Production: bare Ebyte E73 (nRF52840) custom PCB.
; First flash needs an SWD programmer (nRF52840-DK / J-Link) to install the
; bootloader; afterwards you can switch to USB/UF2 if a USB port is fitted.
; ---------------------------------------------------------------------------
[env:e73_custom]
board = adafruit_feather_nrf52840
upload_protocol = jlink
debug_tool = jlink
build_flags =
    ${env.build_flags}
    ; The custom PCB has no USB; data port for the mic is left channel only.
    -DHIVEINSIDE_CUSTOM_PCB=1
