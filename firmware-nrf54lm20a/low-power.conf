# Deployment profile: remove the always-on diagnostic UART and its formatting
# support.  Sensor values continue to be published over BLE and OTA remains
# available.  Apply together with low-power.overlay; see docs/low-power.md.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_LOG=n

# Let drivers participate in Zephyr power-management transitions.  Normal BLE
# operation still uses CPU idle rather than system-off because the controller
# must keep advertising.
CONFIG_PM_DEVICE=y
