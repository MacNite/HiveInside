# Deployment profile: remove the always-on diagnostic UART and its formatting
# support. Sensor values continue to be published over BLE and OTA remains
# available. Apply together with low-power.overlay; see docs/low-power.md.
#
# This file holds only the deltas from prj.conf. Everything the application
# needs at runtime — BLE, MCUboot/OTA, the sensor stack — stays as prj.conf
# defines it. CONFIG_LOG is already n in prj.conf and is not repeated here.
#
# Note the trade-off: with the console and printk() gone, this image reports
# nothing on failure. A wedged driver or a persistent LDO1 error is invisible
# except as stale values in the beacon. The watchdog still recovers a hang —
# it is enabled in prj.conf, so it applies here too — but diagnosing why needs
# the normal build.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n

# printk() was the only float-formatting user; with it gone the cbprintf
# floating-point formatter is dead code. The float math in mic.c/fft.c is
# unaffected — that is CONFIG_FPU, which stays on.
CONFIG_CBPRINTF_FP_SUPPORT=n

# Deliberately NOT set here: CONFIG_PM_DEVICE. Without CONFIG_PM (system power
# management) or CONFIG_PM_DEVICE_RUNTIME, nothing ever runs a device's suspend
# action, so it costs flash and alters driver init paths while saving no power.
# Enabling Zephyr device PM is a measured change, not a free one — see the
# "Device power management" section of docs/low-power.md before adding it.
