# MCUboot child-image config for the `west --sysbuild` build. PlatformIO ignores
# this file — it never builds MCUboot (see docs/flashing.md).
#
# Keep MCUboot small enough for the board's existing 64 KiB boot partition.
CONFIG_LOG=y
CONFIG_MCUBOOT_LOG_LEVEL_WRN=y

# The bootloader console is off to save flash in the 62 KiB boot partition, so
# MCUboot's log above has no backend and goes nowhere in a normal build. That
# also means a bootloader that refuses to start slot 0 fails *silently* — no
# console output and no BLE, because the application never runs.
#
# To debug that: comment out the three lines below, set
# CONFIG_MCUBOOT_LOG_LEVEL_INF=y above, rebuild with --pristine and re-flash.
# MCUboot then reports what it finds in slot 0 on uart20, at the same 115200 8N1
# the application uses. See "Device is silent after flashing" in
# docs/flashing.md.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# Keep the board's power-management drivers out of the bootloader.
#
# MCUboot builds single-threaded on Nordic SoCs (its Kconfig has
# `config MULTITHREADING / default n if SOC_FAMILY_NORDIC_NRF`), so the kernel
# mutex, work-queue and sleep implementations are not compiled in. The XIAO
# board tree, however, applies to *every* sysbuild image, and it brings in
# drivers that use them:
#
#   * the board defconfig sets CONFIG_REGULATOR=y, and the board devicetree has
#     the `power_en` fixed regulator (regulator-boot-on) -> regulator_fixed.c,
#     which calls k_usleep();
#   * the board devicetree also has the nPM1300 on a bit-banged `gpio-i2c` bus,
#     so MFD_NPM13XX is `default y` -> it `select I2C` (overriding MCUboot's own
#     `# CONFIG_I2C is not set`, hence the "I2C ... was assigned the value 'n'
#     but got the value 'y'" Kconfig warning) -> i2c_gpio.c and mfd_npm13xx.c,
#     which call k_mutex_*() and k_work_submit().
#
# Linking the MCUboot image then fails with "undefined reference to
# z_impl_k_mutex_lock / k_work_submit / z_impl_k_usleep". The application image
# is unaffected because it is multithreaded, which is why a plain `west build`
# (and PlatformIO, which never builds MCUboot) succeeds and only `--sysbuild`
# breaks.
#
# The bootloader only needs RRAM to load slot 0; the PMIC and the sensor power
# gate are the application's job (src/power.c). Turning these two off removes
# the drivers and shrinks the bootloader.
CONFIG_REGULATOR=n
CONFIG_MFD=n

# Image signing uses the SDK's default development key, and sysbuild signs the
# application with the same key so test-swap works out of the box. For a real
# deployment, generate a private key and point MCUboot at it with
# CONFIG_BOOT_SIGNATURE_KEY_FILE (and keep the public key with the release), so
# the device only accepts images you signed.
