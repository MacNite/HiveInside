# MCUboot child-image config for the `west --sysbuild` build. PlatformIO ignores
# this file — it never builds MCUboot (see docs/flashing.md).
#
# Keep MCUboot small enough for the board's existing 64 KiB boot partition.
CONFIG_LOG=y
CONFIG_MCUBOOT_LOG_LEVEL_WRN=y
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# Image signing uses the SDK's default development key, and sysbuild signs the
# application with the same key so test-swap works out of the box. For a real
# deployment, generate a private key and point MCUboot at it with
# CONFIG_BOOT_SIGNATURE_KEY_FILE (and keep the public key with the release), so
# the device only accepts images you signed.
