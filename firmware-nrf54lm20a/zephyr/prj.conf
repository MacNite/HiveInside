# HiveInside nRF54LM20A — Step 1: blinky.
#
# Deliberately minimal. We only need the GPIO driver to drive the on-board LED.
# Additional application features are intentionally outside this blinky project.
CONFIG_GPIO=y

# Console/log over the USB CDC-ACM or UART so `west build -t menuconfig` and
# printk() output are visible during bring-up. Comment out for lowest power.
CONFIG_LOG=y
CONFIG_PRINTK=y
