# HiveInside nRF54LM20A — measurement beacon firmware.
#
# Kept identical to zephyr/prj.conf (the copy PlatformIO's Seeed Zephyr
# builder reads); edit both together.

# ── Peripherals ──
CONFIG_GPIO=y
CONFIG_I2C=y

# nPM1300 PMIC: fuel-gauge voltage via the sensor API (battery.c) and LDO1
# raised to 3.3 V for the IMU/mic rail (power.c + app.overlay). Both degrade
# gracefully if the devicetree carries no nPM1300 nodes.
CONFIG_SENSOR=y
CONFIG_REGULATOR=y
# nPM1300 is an MFD parent; without this its charger/regulator children
# compile out even though their devicetree nodes are present.
CONFIG_MFD=y

# The board devicetree binds the on-board LSM6DS3TR-C to Zephyr's LSM6DSL
# sensor driver; accel.c owns the chip through raw I²C register access
# instead (it needs tight-loop 400 Hz burst sampling and power-down control),
# so keep the driver from also initialising and configuring it.
CONFIG_LSM6DSL=n

# On-board PDM microphone through the dmic API (mic.c). Compiles to a stub
# when no nordic,nrf-pdm node is enabled in the devicetree.
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# ── Bluetooth: connectable beacon + version/OTA GATT service ──
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="HiveInside"
CONFIG_BT_MAX_CONN=1
# Room for a large ATT MTU so a future OTA implementation gets ~244-byte
# chunks; harmless for today's small version-JSON reads.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

# ── FFT / float ──
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# ── Console + logs over the on-board debugger's USB-CDC bridge (115200) ──
#
# The XIAO nRF54LM20A Sense carries an on-board SAMD11 CMSIS-DAP debugger that
# owns the USB-C port. Besides SWD flashing it bridges the SoC's UART20
# (P1.11 TX / P1.10 RX — internal pins, *not* on the XIAO header) to a USB CDC
# ACM port on the host (/dev/ttyACM0). The board definition already selects
# `zephyr,console = &uart20`, so console output rides that bridge to the PC —
# the nRF54's own USBHS is not used (it is not wired to the connector; the
# SAMD11 owns the port), so no native USB device stack is enabled here.
#
# Make the console driver explicit so it can never be configured out, and keep
# it a plain polled UART: unlike a USB-CDC console it never blocks waiting for
# a host DTR, so the firmware boots and advertises whether or not a monitor is
# open.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Zephyr subsystem logs (Bluetooth, drivers) stay at the default deferred mode.
# The application itself logs only via printk (routed straight to the console
# by CONFIG_LOG_PRINTK=n below), so synchronous LOG_MODE_IMMEDIATE buys nothing
# here and is avoided — rendering logs in the caller's context during BT
# bring-up is a needless way to add early-boot fragility.
CONFIG_LOG=y

# Root cause of the "no serial output" symptom: with CONFIG_LOG=y, Zephyr
# defaults CONFIG_LOG_PRINTK=y, which reroutes every printk() into the logging
# subsystem. This firmware emits *all* of its bring-up output with printk()
# (there are no LOG_INF/LOG_ERR calls), so that output went through the
# deferred, thread- and backend-dependent log pipeline and never reliably
# reached the console. Turn it off so printk() writes straight to the UART
# console — the banner and every message appear on /dev/ttyACM0 immediately
# and in order.
CONFIG_LOG_PRINTK=n

# Sensor captures and the FFTs run on the main thread.
CONFIG_MAIN_STACK_SIZE=4096
