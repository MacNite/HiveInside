# HiveInside nRF54LM20A — sensor readout firmware (target 1).
#
# Zephyr picks this up automatically for both build configurations; the
# low-power deployment image layers low-power.conf on top of it through
# EXTRA_CONF_FILE. See docs/vscode-build.md.

# ── Peripherals ──
CONFIG_GPIO=y
CONFIG_I2C=y

# nPM1300 PMIC: fuel-gauge voltage via the sensor API (battery.c) and LDO1
# raised to 3.3 V for the IMU/mic rail (power.c + app.overlay). Both degrade
# gracefully if the devicetree carries no nPM1300 nodes.
CONFIG_SENSOR=y
CONFIG_REGULATOR=y
# nPM1300 is an MFD parent; without this its charger/regulator children compile
# out even though their devicetree nodes are present.
CONFIG_MFD=y

# The board devicetree binds the on-board LSM6DS3TR-C to Zephyr's LSM6DSL
# sensor driver; accel.c owns the chip through raw I²C register access instead,
# so keep the driver from also initialising and configuring it.
CONFIG_LSM6DSL=n

# On-board PDM microphone through the dmic API (mic.c). Compiles to a stub when
# no nordic,nrf-pdm node is enabled in the devicetree.
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# ── Float math + float printf ──
# mic.c uses sqrtf()/log10f(); the readout prints floats, which needs the
# cbprintf floating-point formatter.
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# ── Console over the on-board debugger's USB-CDC bridge (115200) ──
#
# The XIAO nRF54LM20A Sense carries an on-board SAMD11 CMSIS-DAP debugger that
# owns the USB-C port. Besides SWD flashing it bridges the SoC's uart20 (P1.11
# TX / P1.10 RX — internal pins, *not* on the XIAO header) to a USB CDC ACM port
# on the host (/dev/ttyACM0). The board definition already selects
# `zephyr,console = &uart20`, so console output rides that bridge to the PC —
# the nRF54's own USBHS is not used (the SAMD11 owns the port), so no native USB
# device stack is enabled here.
#
# Keep the console a plain polled UART: unlike a USB-CDC console it never blocks
# waiting for a host DTR, so the firmware boots and samples whether or not a
# monitor is open.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# The application uses only printk(), not Zephyr's LOG_* API. Keep the log
# subsystem disabled so printk() stays a direct, polled UART write and no
# separate log-processing thread is started.
CONFIG_LOG=n

# ── Watchdog ──
# Unattended in-hive operation: a hang inside a sensor driver would otherwise
# leave the node advertising a stale measurement forever. src/watchdog.c arms
# wdt31 (enabled in app.overlay) and main.c feeds it, including through the long
# idle between cycles. See src/hive_config.h for the timeout.
CONFIG_WATCHDOG=y

# Tickless idle is the Zephyr default; pin it so the assumption is explicit.
# Without it the CPU would wake on every system tick throughout the five-minute
# interval, which would dominate every other saving described in
# docs/low-power.md.
CONFIG_TICKLESS_KERNEL=y

# ── HiveHub-compatible connectable BLE measurement beacon + OTA ──
# The controller repeats the last 29-byte reading without waking the CPU.
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="HiveInside"
# beacon.c appends "-XXXX" from the device's own address to the advertised name
# (see HIVEINSIDE_DEVICE_NAME_ADDR_SUFFIX in src/hive_config.h) so several nodes
# in range are told apart. That address is only known at runtime, so the GAP
# Device Name characteristic has to be writable from the application for it to
# report the same string a scanner sees; the value above is what a client reads
# in the window before bt_set_name() runs. The bound covers "HiveInside-XXXX"
# with room to spare — a BUILD_ASSERT in beacon.c fails if the name outgrows it.
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=20
# Keep legacy advertising (ADV_IND). Only the legacy PDU may carry both the
# measurement (primary packet) and the name (scan response) at once; extended
# advertising forbids that pair, so pin it off to avoid a rejected beacon.
CONFIG_BT_EXT_ADV=n
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_DYNAMIC_DB=n

# beacon.c restarts advertising from the system workqueue after a disconnect
# (see the comment on adv_restart_work there), and ota.c drives the connection
# teardown and reboot from it too. bt_le_adv_start() plus the synchronous HCI
# command it blocks on is deeper than the 1024-byte Zephyr default was chosen
# for; 1 KiB more RAM is the cheapest possible way to not have to reason about
# that margin.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# HiveHub requests MTU 247 and sends up to 244 payload bytes per DATA write.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=3

# MCUboot test swap and direct streaming into the secondary fixed partition.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_CRC=y
CONFIG_REBOOT=y

# ── Writing RRAM while the radio is up (this is what makes OTA work) ───────
#
# An OTA writes the secondary slot from inside a GATT write callback, i.e. with
# a live BLE connection. On this SoC that is not a plain memory write: upstream
# Zephyr's link layer (CONFIG_BT_LL_SW_SPLIT) makes
# SOC_FLASH_NRF_RADIO_SYNC_TICKER the default for the RRAM driver, so every
# flash_write() issued once the controller is running is executed inside a
# ticker-scheduled radio timeslot — see drivers/flash/soc_flash_nrf_rram.c and
# subsys/bluetooth/controller/flash/soc_flash_nrf_ticker.c. Two properties of
# that path decide whether an OTA can complete at all, and both are governed by
# the setting below:
#
#   * The timeslot length comes from CONFIG_NRF_RRAM_WRITE_BUFFER_SIZE
#     (FLASH_SLOT_WRITE is 500 us at the default of 1, 8000 us at 32), and
#     nrf_flash_sync_set_context() then derives the flash ticker's period as
#     `slot - FLASH_SYNC_SWITCHING_TIME`, where the switching time is a fixed
#     1700 us. At the default of 1 that subtraction is 500 - 1700 on an
#     unsigned value: it wraps, and the flash ticker is left with a nonsense
#     period instead of a usable one.
#   * nrf_flash_sync_check_time_limit() returns true unconditionally on
#     nRF54Lx — RRAM writes are not constant-time, so the driver deliberately
#     does no more than one iteration per timeslot. One timeslot therefore
#     moves at most CONFIG_NRF_RRAM_WRITE_BUFFER_SIZE 128-bit lines, i.e. 16
#     bytes at the default of 1, and a single 512-byte flush would need 32
#     consecutive timeslots on that broken schedule.
#
# The visible symptom is precise and worth recording, because it looks nothing
# like a flash problem from the relay's side: BEGIN succeeds (it touches no
# flash beyond flash_img_init()), the first two 244-byte DATA chunks succeed
# (they only fill stream_flash's buffer), and the *third* fails — that is the
# write that first fills the 512-byte buffer and so triggers the first real
# flash_write(). The device answers ATT "unlikely error", reports OTA_ERR_WRITE
# (state 0x12) with received=488, and the radio events the flash ticker aborted
# in the meantime take the link down with a supervision timeout (HCI 0x08).
#
# 32 is the maximum the driver allows and fixes both halves: the period becomes
# 8000 - 1700 = 6300 us, and one timeslot moves a full 512 bytes.
CONFIG_NRF_RRAM_WRITE_BUFFER_SIZE=32

# Pin the image writer's buffer to exactly the 512 bytes one timeslot can now
# carry, so each flash_img_buffered_write() flush is a single flash_write() that
# finishes in a single timeslot. This is also Zephyr's current default; it is
# stated here because it is no longer a free choice — a larger buffer would
# silently put the transfer back on the multi-timeslot path described above.
CONFIG_IMG_BLOCK_BUF_SIZE=512

# The microphone capture and float formatting run on the main thread. Reserve
# headroom for the deepest driver/printf call chain so a stack overrun cannot
# turn into a hard-fault/reset loop.
CONFIG_MAIN_STACK_SIZE=8192
