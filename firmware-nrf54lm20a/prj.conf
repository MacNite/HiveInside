# HiveInside nRF54LM20A — measurement beacon firmware.
#
# Kept identical to zephyr/prj.conf (the copy PlatformIO's Seeed Zephyr
# builder reads); edit both together.

# ── Peripherals ──
CONFIG_GPIO=y
CONFIG_I2C=y

# nPM1300 PMIC: fuel-gauge voltage via the sensor API (battery.c) and LDO1
# raised to 3.3 V for the IMU/mic rail (power.c + app.overlay). Both degrade
# gracefully if the devicetree carries no nPM1300 nodes.
CONFIG_SENSOR=y
CONFIG_REGULATOR=y

# The board devicetree binds the on-board LSM6DS3TR-C to Zephyr's LSM6DSL
# sensor driver; accel.c owns the chip through raw I²C register access
# instead (it needs tight-loop 400 Hz burst sampling and power-down control),
# so keep the driver from also initialising and configuring it.
CONFIG_LSM6DSL=n

# On-board PDM microphone through the dmic API (mic.c). Compiles to a stub
# when no nordic,nrf-pdm node is enabled in the devicetree.
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# ── Bluetooth: connectable beacon + version/OTA GATT service ──
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="HiveInside"
CONFIG_BT_MAX_CONN=1
# Room for a large ATT MTU so a future OTA implementation gets ~244-byte
# chunks; harmless for today's small version-JSON reads.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

# ── FFT / float ──
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# ── Console/log over UART at 115200 for bring-up and installation checks ──
CONFIG_LOG=y
CONFIG_PRINTK=y

# Sensor captures and the FFTs run on the main thread.
CONFIG_MAIN_STACK_SIZE=4096
