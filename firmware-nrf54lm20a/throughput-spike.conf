# TEMPORARY measurement profile: BLE notification throughput (issue #71, phase 0e).
#
# Layer this on top of prj.conf the same way low-power.conf is layered — as an
# EXTRA Kconfig fragment, never a base one (see docs/vscode-build.md for why
# that distinction matters). On the command line:
#
#   west build --sysbuild -b xiao_nrf54lm20a/nrf54lm20a/cpuapp -d spike \
#       firmware-nrf54lm20a -- -DEXTRA_CONF_FILE=throughput-spike.conf
#
# This is a bench image. It keeps the console (it is layered on prj.conf, not on
# low-power.conf) because the measurement is read from the serial log as well as
# over GATT, and it must never be uploaded as a release: the extra GATT service
# lets anything in radio range make the node transmit continuously.
#
# See docs/ble-throughput-spike.md for how to run it and what the numbers mean.

# Compile src/throughput.c in. The application's switches are plain C macros in
# src/hive_config.h (deliberately overridable "from the build"), so this is how
# a Kconfig fragment reaches one.
CONFIG_COMPILER_OPT="-DENABLE_THROUGHPUT_SPIKE=1"

# Link-parameter visibility and control. Both symbols do double duty: they
# enable the bt_conn_le_*_update() calls the spike makes, and they are what
# compile the matching .le_phy_updated / .le_data_len_updated callbacks into
# struct bt_conn_cb, which is where the answer to "are we really running 2M PHY
# and 251-byte PDUs?" actually comes from.
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y

# The knob most likely to move the result. Each controller TX buffer is one
# notification that can be queued into a connection event, and throughput.c
# takes its credit count straight from this symbol — so re-running the
# measurement at 3 (the prj.conf value), 6 and 12 sweeps notifications-per-event
# without touching a line of code.
#
# Raising it costs RAM: roughly CONFIG_BT_BUF_ACL_TX_SIZE (251) bytes plus
# overhead per buffer. Check the build's RAM report when sweeping upward.
CONFIG_BT_BUF_ACL_TX_COUNT=6
