[platformio]
default_envs = seeed-xiao-nrf54lm20a

[env:seeed-xiao-nrf54lm20a]
; Pinned upstream commit for reproducible PlatformIO builds.
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#9ba53b691fb007d9c1b8fd37600cc71d6702125a
board = seeed-xiao-nrf54lm20a
framework = zephyr
platform_packages =
    platformio/toolchain-gccarmnoneeabi@~1.90201.0
monitor_speed = 115200
upload_protocol = cmsis-dap
; `pio run` here is a compile check only. Once MCUboot is enabled the bootable
; image is the merged MCUboot + signed-app hex from a `west --sysbuild` build,
; which PlatformIO does not produce; this guard blocks `pio run -t upload` so a
; non-bootable application-only image is never flashed. See docs/flashing.md.
extra_scripts = pre:pio_guard_mcuboot_upload.py
