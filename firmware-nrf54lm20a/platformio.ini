[platformio]
default_envs = seeed-xiao-nrf54lm20a

[env:seeed-xiao-nrf54lm20a]
; Pinned upstream commit for reproducible PlatformIO builds.
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#9ba53b691fb007d9c1b8fd37600cc71d6702125a
board = seeed-xiao-nrf54lm20a
framework = zephyr
platform_packages =
    platformio/toolchain-gccarmnoneeabi@~1.90201.0
monitor_speed = 115200
; Upload via pyOCD instead of the board's cmsis-dap/OpenOCD default. OpenOCD is
; invoked by the Seeed builder with a fixed Seeed CMSIS-DAP VID:PID filter
; (0x2886:0x0068), so a generic external probe (e.g. a XIAO RP2040 running
; Raspberry Pi Debugprobe, which enumerates as 0x2E8A:0x000C) is filtered out
; and OpenOCD reports "unable to find a matching CMSIS-DAP device". pyOCD
; auto-detects any CMSIS-DAP probe and applies no such filter. Use probe-rs as
; a fallback if pyOCD lacks the nRF54LM20A target pack. See docs/flashing.md.
upload_protocol = pyocd
