# sysbuild.conf — multi-image (sysbuild) configuration for a `west build`.
#
# PlatformIO's Seeed Zephyr builder builds the application image only, linked
# for MCUboot slot0 via CONFIG_BOOTLOADER_MCUBOOT in prj.conf; the MCUboot
# bootloader is provisioned once (this sysbuild build, or Seeed's prebuilt
# bootloader). A `west build` with sysbuild picks up this file and additionally
# builds MCUboot, producing a complete, OTA-capable set (bootloader + signed
# app in slot0). The board DTS supplies the mcuboot/slot0/slot1/storage RRAM
# partitions, so no partition manager / pm_static file is required.
#
#   west build -b xiao_nrf54lm20a/nrf54lm20a/cpuapp firmware-nrf54lm20a
#
SB_CONFIG_BOOTLOADER_MCUBOOT=y
