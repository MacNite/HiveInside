CONFIG_GPIO=y

# Reproduce the exact host/controller selection used by the production image.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_LL_SW_SPLIT=y
CONFIG_BT_DEVICE_NAME="HI-BT-Smoke"

# Test 1: match the production Bluetooth data-buffer configuration while
# keeping the smoke test free of PMIC, sensor, audio, GATT, and beacon code.
# These settings directly alter the ACL/L2CAP net_buf pools used by bt_enable().
CONFIG_BT_MAX_CONN=1
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

# Test 2: match the production FPU, float-formatting, and main-thread stack
# configuration. This changes the runtime and RAM layout without enabling any
# PMIC, sensor, audio, GATT, advertising, or beacon code.
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_MAIN_STACK_SIZE=8192

# Test 3: enable the production PDM microphone driver. The test still does
# not capture audio; merely enabling the controller tests its devicetree and
# early driver-initialisation path before bt_enable() runs.
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=n
